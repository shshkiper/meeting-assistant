---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: meeting-assistant

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: meeting-assistant-config
  namespace: meeting-assistant
data:
  APP_ENV: "production"
  WHISPER_MODEL: "large-v3"
  WHISPER_DEVICE: "cpu"
  WHISPER_LANGUAGE: "ru"
  LLM_PROVIDER: "ollama"
  LLM_BASE_URL: "http://ollama:11434"
  LLM_MODEL: "llama3.1:8b"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_SECURE: "false"

---
# Secret (replace values with base64-encoded secrets)
apiVersion: v1
kind: Secret
metadata:
  name: meeting-assistant-secrets
  namespace: meeting-assistant
type: Opaque
stringData:
  SECRET_KEY: "change-me-in-production"
  DATABASE_URL: "postgresql+asyncpg://meetinguser:meetingpass@postgres:5432/meetingdb"
  REDIS_URL: "redis://redis:6379/0"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: meeting-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: meeting-assistant/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: meeting-assistant-config
            - secretRef:
                name: meeting-assistant-secrets
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "8Gi"
              cpu: "4"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: meeting-assistant
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000

---
# Celery Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: meeting-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: meeting-assistant/backend:latest
          command: ["celery", "-A", "app.services.pipeline.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
          envFrom:
            - configMapRef:
                name: meeting-assistant-config
            - secretRef:
                name: meeting-assistant-secrets
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "16Gi"
              cpu: "8"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc

---
# PVC for model cache
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache-pvc
  namespace: meeting-assistant
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: meeting-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: meeting-assistant/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: meeting-assistant
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meeting-assistant-ingress
  namespace: meeting-assistant
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
    - host: meeting.bank.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
